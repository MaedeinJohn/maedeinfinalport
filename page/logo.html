    <!-- EXISTING JS -->

    <script src="../js/scrip.js"></script>



    <!-- =====================================================
         LOGO GALLERY JAVASCRIPT
    ====================================================== -->

    <script>

        const logoImages = [

            "../assets/logo/L1.png",
            "../assets/logo/L2.png",
            "../assets/logo/L3.png",
            "../assets/logo/L4.png",
            "../assets/logo/L5.png",
            "../assets/logo/L6.png",
            "../assets/logo/L7.png",
            "../assets/logo/L8.png",
            "../assets/logo/L9.png",
            "../assets/logo/L10.png"

        ];


        const logoNames = [

            "L1",
            "L2",
            "L3",
            "L4",
            "L5",
            "L6",
            "L7",
            "L8",
            "L9",
            "L10"

        ];


        const lightbox =
            document.getElementById(
                "logoLightbox"
            );


        const lightboxImage =
            document.getElementById(
                "logoLightboxImage"
            );


        const logoNumber =
            document.getElementById(
                "logoNumber"
            );


        const thumbnails =
            document.getElementById(
                "logoThumbs"
            );


        let currentLogo = 0;



        /* =================================================
           SHOW LOGO
        ================================================== */

        function showLogo(index) {

            currentLogo =
                (index + logoImages.length)
                % logoImages.length;


            lightboxImage.src =
                logoImages[currentLogo];


            lightboxImage.alt =
                "Logo Design " +
                logoNames[currentLogo];


            logoNumber.textContent =
                logoNames[currentLogo];


            document
                .querySelectorAll(".lightbox-thumb")
                .forEach(
                    (thumb, i) => {

                        thumb.classList.toggle(
                            "active",
                            i === currentLogo
                        );

                    }
                );

        }



        /* =================================================
           OPEN
        ================================================== */

        function openLogo(index) {

            showLogo(index);

            lightbox.classList.add(
                "active"
            );

            lightbox.setAttribute(
                "aria-hidden",
                "false"
            );

            document.body.style.overflow =
                "hidden";

        }



        /* =================================================
           CLOSE
        ================================================== */

        function closeLogo() {

            lightbox.classList.remove(
                "active"
            );

            lightbox.setAttribute(
                "aria-hidden",
                "true"
            );

            document.body.style.overflow =
                "";

        }



        /* =================================================
           OPEN WHEN LOGO IS CLICKED
        ================================================== */

        document
            .querySelectorAll(
                ".logo-design-item"
            )
            .forEach(
                (item) => {

                    item.addEventListener(
                        "click",
                        () => {

                            openLogo(
                                Number(
                                    item.dataset.index
                                )
                            );

                        }
                    );

                }
            );



        /* =================================================
           CLOSE
        ================================================== */

        document
            .getElementById("logoClose")
            .addEventListener(
                "click",
                closeLogo
            );



        /* =================================================
           PREVIOUS
        ================================================== */

        document
            .getElementById("logoPrev")
            .addEventListener(
                "click",
                () => {

                    showLogo(
                        currentLogo - 1
                    );

                }
            );



        /* =================================================
           NEXT
        ================================================== */

        document
            .getElementById("logoNext")
            .addEventListener(
                "click",
                () => {

                    showLogo(
                        currentLogo + 1
                    );

                }
            );



        /* =================================================
           CLICK OUTSIDE
        ================================================== */

        lightbox.addEventListener(
            "click",
            (event) => {

                if (
                    event.target ===
                    lightbox
                ) {

                    closeLogo();

                }

            }
        );



        /* =================================================
           KEYBOARD
        ================================================== */

        document.addEventListener(
            "keydown",
            (event) => {

                if (
                    !lightbox.classList.contains(
                        "active"
                    )
                ) {

                    return;

                }


                if (
                    event.key === "Escape"
                ) {

                    closeLogo();

                }


                if (
                    event.key === "ArrowLeft"
                ) {

                    showLogo(
                        currentLogo - 1
                    );

                }


                if (
                    event.key === "ArrowRight"
                ) {

                    showLogo(
                        currentLogo + 1
                    );

                }

            }
        );



        /* =================================================
           CREATE THUMBNAILS
        ================================================== */

        logoImages.forEach(
            (src, index) => {

                const button =
                    document.createElement(
                        "button"
                    );


                button.type =
                    "button";


                button.className =
                    "lightbox-thumb";


                button.innerHTML = `

                    <img
                        src="${src}"
                        alt="${logoNames[index]}"
                    >

                    <span
                        class="lightbox-thumb-number"
                    >
                        ${logoNames[index]}
                    </span>

                `;


                button.addEventListener(
                    "click",
                    () => {

                        showLogo(index);

                    }
                );


                thumbnails.appendChild(
                    button
                );

            }
        );

    </script>


</body>
