    <div class="image-lightbox" id="imageLightbox">

        <button
            class="lightbox-close"
            id="lightboxClose"
        >
            ×
        </button>

        <button
            class="lightbox-prev"
            id="lightboxPrev"
        >
            ‹
        </button>

        <div class="lightbox-content">

            <div
                class="lightbox-number"
                id="lightboxNumber"
            >
                1 / 23
            </div>

            <img
                class="lightbox-image"
                id="lightboxImage"
                src=""
                alt=""
            >

            <div
                class="lightbox-thumbnails"
                id="lightboxThumbnails"
            ></div>

        </div>

        <button
            class="lightbox-next"
            id="lightboxNext"
        >
            ›
        </button>

    </div>


    <script src="../js/scrip.js"></script>


    <!-- IMAGE VIEWER ONLY -->
    <script>

        const galleryItems =
            document.querySelectorAll(".design-item");

        const lightbox =
            document.getElementById("imageLightbox");

        const lightboxImage =
            document.getElementById("lightboxImage");

        const lightboxNumber =
            document.getElementById("lightboxNumber");

        const thumbnails =
            document.getElementById("lightboxThumbnails");

        const closeButton =
            document.getElementById("lightboxClose");

        const prevButton =
            document.getElementById("lightboxPrev");

        const nextButton =
            document.getElementById("lightboxNext");


        let currentIndex = 0;


        const images = Array.from(galleryItems)
            .map(item => item.querySelector("img"));


        images.forEach((image, index) => {

            image.parentElement.addEventListener(
                "click",
                () => {

                    currentIndex = index;

                    openLightbox();

                }
            );

        });


        function openLightbox() {

            lightbox.classList.add("active");

            updateLightbox();

            document.body.style.overflow = "hidden";

        }


        function closeLightbox() {

            lightbox.classList.remove("active");

            document.body.style.overflow = "";

        }


        function updateLightbox() {

            const image =
                images[currentIndex];

            lightboxImage.src =
                image.src;

            lightboxImage.alt =
                image.alt;

            lightboxNumber.textContent =
                `${currentIndex + 1} / ${images.length}`;

            thumbnails.innerHTML = "";


            images.forEach((thumbImage, index) => {

                const button =
                    document.createElement("button");

                button.className =
                    "lightbox-thumb";


                if (index === currentIndex) {

                    button.classList.add("active");

                }


                button.innerHTML = `

                    <img
                        src="${thumbImage.src}"
                        alt=""
                    >

                    <span class="lightbox-thumb-number">
                        ${index + 1}
                    </span>

                `;


                button.addEventListener(
                    "click",
                    () => {

                        currentIndex = index;

                        updateLightbox();

                    }
                );


                thumbnails.appendChild(button);

            });

        }


        function showNext() {

            currentIndex++;

            if (currentIndex >= images.length) {

                currentIndex = 0;

            }

            updateLightbox();

        }


        function showPrevious() {

            currentIndex--;

            if (currentIndex < 0) {

                currentIndex =
                    images.length - 1;

            }

            updateLightbox();

        }


        closeButton.addEventListener(
            "click",
            closeLightbox
        );


        nextButton.addEventListener(
            "click",
            showNext
        );


        prevButton.addEventListener(
            "click",
            showPrevious
        );


        lightbox.addEventListener(
            "click",
            event => {

                if (
                    event.target === lightbox
                ) {

                    closeLightbox();

                }

            }
        );


        document.addEventListener(
            "keydown",
            event => {

                if (
                    !lightbox.classList.contains("active")
                ) {

                    return;

                }


                if (event.key === "Escape") {

                    closeLightbox();

                }


                if (event.key === "ArrowRight") {

                    showNext();

                }


                if (event.key === "ArrowLeft") {

                    showPrevious();

                }

            }
        );

    </script>
